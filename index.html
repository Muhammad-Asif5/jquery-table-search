<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery-table-search + tablePager (client / server mode)</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Plugin CSS -->
    <link href="src/jquery.tableSearch.bundle.css" rel="stylesheet">
    <link href="src/jquery.tableSearch.responsive.css" rel="stylesheet">
    <link href="src/jquery.tablePager.bundle.css" rel="stylesheet">
</head>

<body class="p-4">

    <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
        <h4 class="mb-0">Click a header to sort, or the bars icon to filter</h4>
    </div>

    <!--
        data-field = the property of each JSON row shown in that column (server mode; ignored in client mode).
        In client mode the <tbody> is filled below from the demo data, standing in for your server-rendered rows.
    -->
    <table class="table table-bordered table-hover" id="myTable">
        <thead class="table-light">
            <tr>
                <th data-type="string" data-field="name">Name</th>
                <th data-type="string" data-field="position">Position</th>
                <th data-type="string" data-field="office">Office</th>
                <th data-type="numeric" data-field="extn">Extn.</th>
                <th data-type="date" data-field="start_date">Start date</th>
                <th data-currency data-field="salary">Salary</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS (optional, used by the auto-built pager markup) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Demo only: sample data + an in-browser mock of the server endpoint. Remove in production. -->
    <script src="demo-server.js"></script>

    <!-- Plugins -->
    <script src="src/jquery.tableSearch.js"></script>
    <script src="src/jquery.tablePager.js"></script>

    <script>
        $(function () {

            // ----------------------------------------------------------------
            // THE ONE SETTING: where do filtering, sorting and paging happen?
            //   'client' -> all rows are in the page, the browser does everything
            //   'server' -> the server returns one filtered/sorted page per request
            // Demo: ?mode=server in the URL. In your app just hard-code it.
            // ----------------------------------------------------------------
            var MODE = 'server' //'server' : 'client';
            var PAGE_SIZE = 5;

            // if (MODE === 'client') {
            //     debugger
            //     var html = MockServer.rows.map(function (r) {
            //         return '<tr><td>' + r.name + '</td><td>' + r.position + '</td><td>' + r.office + '</td><td>' +
            //             r.extn + '</td><td>' + r.start_date + '</td><td>' + r.salary + '</td></tr>';
            //     }).join('');
            //     $('#myTable tbody').html(html);
            // }

            // ----------------------------------------------------------------
            // 1) Filter + sort
            // ----------------------------------------------------------------
            var searchOptions = {
                processing: MODE,                       // 'client' | 'server'
                showSortIcon: true,
                showFilterIcon: true,
                debounceTime: 300,
                dateFormat: 'YYYY/MM/DD',
                numericRegex: /[^0-9.-]+/g,
                currencySymbol: 'Rs',
                currencyPosition: 'prefix',
                currencyFormatCells: true,
                defaultSortColumn: 'Name',
                defaultSortDirection: 'asc',
                showLogicOperator: false,
                defaultLogic: 'and',
                columnLogic: 'and',
                responsive: true,
                responsiveWrap: true,
                mobileSheet: true,
                mobileBreakpoint: 575
            };

            if (MODE === 'server') {
                $.extend(searchOptions, {
                    pageSize: PAGE_SIZE,
                    ajax: { url: 'mock://employees', method: 'POST' },   // <- your endpoint, e.g. '/api/employees'
                    responseMap: { rows: 'data', total: 'total' }        // where rows + total are in the JSON
                });
            }

            $('#myTable').tableSearch(searchOptions);

            // ----------------------------------------------------------------
            // 2) Pagination: same options in both modes.
            //    processing 'server' + tableSearch in server mode => the pager drives tableSearch,
            //    so page + pageSize + sort + filters go to the server in a single request.
            // ----------------------------------------------------------------
            $('#myTable').tablePager({
                enabled: true,
                processing: MODE,                       // 'client' | 'server' | 'auto'
                pageSize: PAGE_SIZE,
                pageSizes: [5, 10, 25, 50],
                showPageSizeSelect: true,
                showInfo: true,
                showPageLabel: false,
                showPageNumbers: true,
                maxPageButtons: 4,
                showFirstLast: true,
                resetPageOnFilter: true,
                resetPageOnSort: false
            });

        });
    </script>

</body>

</html>
